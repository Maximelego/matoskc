services:
    frontend:
        image: node:24-alpine
        working_dir: /app
        volumes:
            - ./frontend/app:/app
            - /app/node_modules
        ports:
            - '5173:5173'

        command: sh -c "npm install && npm run dev -- --host"
        environment:
            - NODE_ENV=development

    backend:
        image: python:3.14-alpine
        working_dir: /app
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app

        command: sh -c "./main.sh"
        environment:
            DATABASE_URL: postgresql://app:app@database:5432/app
        depends_on:
            database:
                condition: service_healthy

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
