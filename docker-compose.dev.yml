services:
	frontend:
		build: ./frontend
		ports:
			- "3000:3000"
		depends_on:
			- backend

	backend:
		build: ./backend
		ports:
			- "8000:8000"
		environment:
			DATABASE_URL: postgresql://app:app@database:5432/app
		depends_on:
			database:
				condition: service_healthy

	database:
		image: postgres:16-alpine
		environment:
			POSTGRES_DB: app
			POSTGRES_USER: app
			POSTGRES_PASSWORD: app
		ports:
			- "5432:5432"
		volumes:
			- postgres_data:/var/lib/postgresql/data
		healthcheck:
			test: ["CMD-SHELL", "pg_isready -U app -d app"]
			interval: 5s
			timeout: 5s
			retries: 5

volumes:
	postgres_data:
