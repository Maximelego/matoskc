services:
    frontend:
        image: node:24-alpine
        working_dir: /app
        volumes:
            - ./frontend/app:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host"
        environment:
            NODE_ENV: development
            VITE_API_PROXY_TARGET: http://backend:8000

    backend:
        image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
        working_dir: /app
        user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        command:
            - dotnet
            - watch
            - --project
            - src/MatosKC.Api/MatosKC.Api.csproj
            - run
            - --no-launch-profile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://0.0.0.0:8000

            HOME: /tmp/dotnet-home
            DOTNET_CLI_HOME: /tmp/dotnet-home
            NUGET_PACKAGES: /tmp/dotnet-home/.nuget/packages
            DOTNET_NOLOGO: "true"
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

            DOTNET_USE_POLLING_FILE_WATCHER: "true"
            DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
            DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"

            ConnectionStrings__MatosKCDatabase: Host=database;Port=5432;Database=matoskc;Username=matoskc;Password=matoskc_dev

            S3__ServiceUrl: http://object-storage:3900
            S3__Region: garage
            S3__AccessKey: GK0123456789abcdef0123456789abcdef
            S3__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            S3__BucketName: matoskc
            S3__ForcePathStyle: "true"
        depends_on:
            database:
                condition: service_healthy
            object-storage:
                condition: service_healthy

    object-storage:
        image: dxflrs/garage:v2.4.1
        command:
            - /garage
            - server
            - --single-node
            - --default-bucket
        environment:
            GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
            GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            GARAGE_DEFAULT_BUCKET: matoskc
        ports:
            - "3900:3900"
            - "3903:3903"
        volumes:
            - ./docker/garage/garage.toml:/etc/garage.toml:ro
            - matoskc_garage_metadata:/var/lib/garage/meta
            - matoskc_garage_data:/var/lib/garage/data
        healthcheck:
            test:
                - CMD
                - /garage
                - status
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        restart: unless-stopped

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: matoskc
            POSTGRES_USER: matoskc
            POSTGRES_PASSWORD: matoskc_dev
        ports:
            - "5432:5432"
        volumes:
            - matoskc_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U matoskc -d matoskc
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    frontend_node_modules:
        name: frontend_node_modules_dev

    matoskc_postgres_data:
        name: matoskc_postgres_data_dev

    matoskc_garage_metadata:
        name: matoskc_garage_metadata_dev

    matoskc_garage_data:
        name: matoskc_garage_data_dev