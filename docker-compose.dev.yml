services:
    frontend:
        image: node:24-alpine
        working_dir: /app
        volumes:
            - ./frontend/app:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host"
        environment:
            NODE_ENV: development

    backend:
        image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
        working_dir: /app
        volumes:
            - ./backend:/app
            - backend_nuget_packages:/root/.nuget/packages
        ports:
            - "8000:8000"
        command:
            - dotnet
            - watch
            - --project
            - src/MatosKC.Api/MatosKC.Api.csproj
            - run
            - --no-launch-profile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://0.0.0.0:8000

            DOTNET_USE_POLLING_FILE_WATCHER: "true"
            DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
            DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"

            ConnectionStrings__MatosKCDatabase: Host=database;Port=5432;Database=matoskc;Username=matoskc;Password=matoskc_dev
        depends_on:
            database:
                condition: service_healthy

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: matoskc
            POSTGRES_USER: matoskc
            POSTGRES_PASSWORD: matoskc_dev
        ports:
            - "5432:5432"
        volumes:
            - matoskc_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U matoskc -d matoskc
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    frontend_node_modules:
    backend_nuget_packages:
    matoskc_postgres_data: