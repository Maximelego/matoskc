services:
    frontend:
        image: node:24-alpine
        working_dir: /app
        volumes:
            - ./frontend/app:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host"
        environment:
            NODE_ENV: development

    backend:
        image: python:3.14-alpine
        working_dir: /app
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
            - backend_venv:/opt/venv
        command: sh /app/main.sh
        environment:
            DATABASE_URL: postgresql+psycopg://matoskc:matoskc@database:5432/matoskc
        depends_on:
            database:
                condition: service_healthy

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: matoskc
            POSTGRES_USER: matoskc
            POSTGRES_PASSWORD: matoskc_dev
        ports:
            - "5432:5432"
        volumes:
            - matoskc_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U matoskc -d matoskc"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    frontend_node_modules:
    backend_venv:
    matoskc_postgres_data:
