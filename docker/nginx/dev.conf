map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name matoskc.hexenis.fr;

    return 308 https://matoskc.hexenis.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name matoskc.hexenis.fr;

    ssl_certificate     /etc/nginx/certs/matoskc.hexenis.fr.pem;
    ssl_certificate_key /etc/nginx/certs/matoskc.hexenis.fr-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /backend {
        return 308 /backend/$is_args$args;
    }

    location ^~ /backend/ {
        proxy_pass http://backend:8000/;
    }

    location / {
        proxy_pass http://frontend:5173;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
    }
}