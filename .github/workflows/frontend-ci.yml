name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  merge_group:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
        working-directory: frontend/app
      - run: sh ./main.sh format-check frontend
      - run: sh ./main.sh lint frontend
      - run: sh ./main.sh build frontend
      # When a frontend test script exists, enable:
      # - run: sh ./main.sh test frontend

# CD placeholder: create a separate deployment workflow after the target is chosen.
# Trigger it on a push to main after the required CI checks have passed.
